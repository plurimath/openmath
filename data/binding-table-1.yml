# frozen_string_literal: true

schema: openmath-binding-table/1
version: 1
description: >
  The CD binding table: which content-dictionary symbols evaluate, and the
  operation each binds to. Adding a binding is adding data here plus the
  operation's implementation in Openmath::Evaluation::Operations; the
  evaluator never dispatches on anything this table does not bind.
bindings:
  # nums1 — the number constructions
  - { cd: nums1, name: integer, operation: identity }
  - { cd: nums1, name: rational, operation: rational }
  # arith1 — the arithmetic core
  - { cd: arith1, name: plus, operation: plus }
  - { cd: arith1, name: times, operation: times }
  - { cd: arith1, name: minus, operation: minus }
  - { cd: arith1, name: unary_minus, operation: unary_minus }
  - { cd: arith1, name: divided_by, operation: divided_by }
  - { cd: arith1, name: power, operation: power }
  - { cd: arith1, name: abs, operation: abs }
  - { cd: arith1, name: max, operation: max }
  - { cd: arith1, name: min, operation: min }
  # relation1 — the comparisons
  - { cd: relation1, name: eq, operation: eq }
  - { cd: relation1, name: neq, operation: neq }
  - { cd: relation1, name: gt, operation: gt }
  - { cd: relation1, name: lt, operation: lt }
  - { cd: relation1, name: geq, operation: geq }
  - { cd: relation1, name: leq, operation: leq }
  # logic1 — the connectives
  - { cd: logic1, name: and, operation: and }
  - { cd: logic1, name: or, operation: or }
  - { cd: logic1, name: xor, operation: xor }
  - { cd: logic1, name: not, operation: not }
  - { cd: logic1, name: implies, operation: implies }
