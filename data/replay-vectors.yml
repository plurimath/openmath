# The replay ledger: deterministic evaluation vectors for the portable
# bindings artifact. Each row carries the request verbatim and the
# expected value (or the typed refusal's error class). The rs/wasm lanes
# replay these rows against the same table; adding a binding adds rows
# here and to the binding table together.
---
schema: openmath-replay-ledger/1
version: 1
vectors:
